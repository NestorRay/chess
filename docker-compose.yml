services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xiangqi}
      POSTGRES_USER: ${POSTGRES_USER:-xiangqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-xiangqi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xiangqi}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      # 只绑定回环地址，由外部反代（nginx 等）转发并终止 HTTPS；
      # 不要改成 0.0.0.0 直接暴露公网，否则可伪造 X-Forwarded-For 绕过按 IP 的登录限流
      - "127.0.0.1:${HTTP_PORT:-8080}:3000"

volumes:
  postgres_data:
